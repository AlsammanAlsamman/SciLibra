[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scilibra"
dynamic = ["version"]
description = "Desktop manager for scientific articles: BibTeX + PDF library, PDF reader & annotator, Google Drive backup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alsamman M. Alsamman", email = "SammanMohammed@gmail.com" }]
requires-python = ">=3.9"
keywords = ["bibtex", "pdf", "reference manager", "scientific articles", "annotation", "research", "kivy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "kivy>=2.3",
    "bibtexparser>=1.4,<2",
    "pylatexenc>=2.10",
    "pymupdf>=1.23",
    "requests>=2.28",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.2",
]

[project.urls]
Homepage = "https://github.com/AlsammanAlsamman/SciLibra"
Issues = "https://github.com/AlsammanAlsamman/SciLibra/issues"
Source = "https://github.com/AlsammanAlsamman/SciLibra"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
scilibra = "scilibra.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "scilibra.__version__" }

[tool.setuptools.packages.find]
include = ["scilibra*"]

[tool.setuptools.package-data]
scilibra = ["gui/*.kv", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*deprecated.*"]
